<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="#0A0A0A" />

  <!-- Ears -->
  <circle cx="24" cy="24" r="8" fill="#B7FF3C" />
  <circle cx="56" cy="24" r="8" fill="#B7FF3C" />
  <circle cx="24" cy="24" r="3.6" fill="#0A0A0A" fillOpacity="0.25" />
  <circle cx="56" cy="24" r="3.6" fill="#0A0A0A" fillOpacity="0.25" />

  <!-- Head -->
  <circle cx="40" cy="44" r="22" fill="#B7FF3C" />

  <!-- Belly patch -->
  <ellipse cx="40" cy="50" rx="13" ry="9" fill="#0A0A0A" fillOpacity="0.12" />

  <!-- Blush -->
  <circle cx="25" cy="48" r="3" fill="#0A0A0A" fillOpacity="0.15" />
  <circle cx="55" cy="48" r="3" fill="#0A0A0A" fillOpacity="0.15" />

  <!-- Eyes -->
  <circle cx="32" cy="40" r="4.2" fill="#0A0A0A" />
  <circle cx="48" cy="40" r="4.2" fill="#0A0A0A" />
  <circle cx="33.4" cy="38.5" r="1.4" fill="white" />
  <circle cx="49.4" cy="38.5" r="1.4" fill="white" />

  <!-- Nose + smile -->
  <circle cx="40" cy="46" r="1.6" fill="#0A0A0A" />
  <path
    d="M34 51C36.5 54.5 43.5 54.5 46 51"
    stroke="#0A0A0A"
    strokeWidth="2.2"
    strokeLinecap="round"
    fill="none"
  />

  <!-- Antenna -->
  <line x1="40" y1="18" x2="40" y2="10" stroke="#B7FF3C" strokeWidth="2.6" strokeLinecap="round" />
  <circle cx="40" cy="9" r="3.6" fill="#B7FF3C" />
  <circle cx="40" cy="9" r="1.5" fill="white" fillOpacity="0.7" />
</svg>
